[workspace]
resolver = "2"
members = [
    "crates/ananta-types",
    "crates/ananta-platform",
    "crates/ananta-format",
    "crates/ananta-core",
    "crates/ananta-execution",
    "crates/ananta-aql",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
