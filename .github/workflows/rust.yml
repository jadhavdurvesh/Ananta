name: Native Rust

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Format, test and lint native workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format Rust workspace
        run: cargo fmt --all
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --workspace --all-targets
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets
      - name: Run native storage example
        run: |
          rm -rf ananta-data
          cargo run -p ananta-core --example basic
          test -s ananta-data/catalog/catalog.anc
          test -n "$(find ananta-data/data/telemetry -maxdepth 1 -type f -name '*.anf' -print -quit)"
      - name: Benchmark bounded scan peak memory
        run: |
          set -euo pipefail
          cargo build -p ananta-core --example memory_benchmark
          BENCH=target/debug/examples/memory_benchmark
          SMALL=/tmp/ananta-memory-small
          LARGE=/tmp/ananta-memory-large
          "$BENCH" generate "$SMALL" 5000 2048
          "$BENCH" generate "$LARGE" 50000 2048
          echo "=== Dataset growth check: 5k vs 50k rows, fixed 512-row batches ==="
          "$BENCH" scan "$SMALL" 512
          "$BENCH" scan "$LARGE" 512
          echo "=== Batch growth check: 256 vs 1024 vs 4096 rows, fixed 50k-row dataset ==="
          "$BENCH" scan "$LARGE" 256
          "$BENCH" scan "$LARGE" 1024
          "$BENCH" scan "$LARGE" 4096
          rm -rf "$SMALL" "$LARGE"
      - name: Benchmark Chronicle ingestion and startup index rebuild
        run: |
          set -euo pipefail
          cargo build --release -p ananta-core --example chronicle_benchmark
          BENCH=target/release/examples/chronicle_benchmark
          ROOT=/tmp/ananta-chronicle-bench
          CHR_SMALL="$ROOT/chronicle-small"
          CHR_LARGE="$ROOT/chronicle-large"
          LEGACY_LARGE="$ROOT/legacy-large"
          mkdir -p "$ROOT"
          echo "=== Ingestion comparison: 100 batches × 128 rows × 512-byte payload ==="
          "$BENCH" generate "$CHR_LARGE" chronicle 100 128 512
          "$BENCH" generate "$LEGACY_LARGE" legacy 100 128 512
          echo "=== Fresh-process startup: legacy ANF vs Chronicle (100 files) ==="
          "$BENCH" open "$LEGACY_LARGE"
          "$BENCH" open "$CHR_LARGE"
          echo "=== Chronicle startup scaling: 25 vs 100 receipt records ==="
          "$BENCH" generate "$CHR_SMALL" chronicle 25 128 512
          "$BENCH" open "$CHR_SMALL"
          "$BENCH" open "$CHR_LARGE"
          rm -rf "$ROOT"
      - name: Benchmark ChronoWeave compaction layouts
        run: |
          set -euo pipefail
          rm -rf /tmp/ananta-chrono-weave-m3 chrono-weave-m3-results.json
          cargo run --release -p ananta-core --example chrono_weave_m3 -- /tmp/ananta-chrono-weave-m3
          test -s chrono-weave-m3-results.json
          cat chrono-weave-m3-results.json
      - name: Upload ChronoWeave benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: chrono-weave-m3-benchmark
          path: chrono-weave-m3-results.json
          if-no-files-found: error
      - name: Benchmark Capsule sizes and Navigation Map scans
        run: |
          set -euo pipefail
          cargo build --release -p ananta-core --example capsule_benchmark
          BENCH=target/release/examples/capsule_benchmark
          ROOT=/tmp/ananta-capsule-bench
          mkdir -p "$ROOT"
          echo "=== Capsule size 512 rows (8 Chronicle batches) ==="
          "$BENCH" "$ROOT/small" 8 512
          echo "=== Capsule size 2,048 rows (32 Chronicle batches) ==="
          "$BENCH" "$ROOT/medium" 32 512
          echo "=== Capsule size 8,192 rows (128 Chronicle batches) ==="
          "$BENCH" "$ROOT/large" 128 512
          rm -rf "$ROOT"
