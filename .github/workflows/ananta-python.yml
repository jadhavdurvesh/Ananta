name: ANANTA Python binding

on:
  push:
    paths:
      - "Cargo.toml"
      - "crates/**"
      - "bindings/ananta-python/**"
      - ".github/workflows/ananta-python.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "crates/**"
      - "bindings/ananta-python/**"
      - ".github/workflows/ananta-python.yml"

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Maturin
        run: python -m pip install --upgrade maturin
      - name: Build ANANTA Python wheel
        run: maturin build --release --manifest-path bindings/ananta-python/Cargo.toml
