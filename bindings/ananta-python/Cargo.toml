[package]
name = "ananta-python"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[workspace]

[lib]
name = "ananta_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
ananta-core = { path = "../../crates/ananta-core" }
ananta-types = { path = "../../crates/ananta-types" }
ananta-aql = { path = "../../crates/ananta-aql" }
